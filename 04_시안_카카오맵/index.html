<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="config.js"></script>
<title>농구장 매칭</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: phone-width app with a fixed bottom tab bar. Court-line arc is the one recurring motif; orange only on primary actions and open-slot markers. */
:root{
  --bg:#EEF1F7; --ink:#0B1B3A; --surface:#FFFFFF; --surface-2:#E3E8F1; --fg:#0F1B2D; --muted:#52627C;
  --line:#CBD3E0; --accent:#F24E12; --accent-fg:#FFFFFF; --accent-soft:#FFE5D8;
  --sea:#CFE0F3; --land:#F3F5F8; --seoul:#E7ECF3; --park:#DCE9DD; --metro:#1FA25B;
  --court:#1D43D6; --court-soft:#DCE6FA; --ok:#1B7A4B; --ok-soft:#D6EFE1; --warn:#8A5A00; --warn-soft:#F7E8C6; --bad:#B3261E;
  --font-body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --font-display:'Do Hyeon','Noto Sans KR','Apple SD Gothic Neo',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1220; --ink:#050A16; --surface:#131C2E; --surface-2:#1B2740; --fg:#E7ECF5; --muted:#9AA9C2; --line:#27344D;
    --sea:#0F2038; --land:#17212F; --seoul:#1F2C42; --park:#1C3030; --metro:#4FD08A;
    --accent:#FF7A3D; --accent-fg:#1A0B02; --accent-soft:#3A2012; --court:#7FA2F5; --court-soft:#1A2848; --ok:#58D08E; --ok-soft:#14362A;
    --warn:#E8B64D; --warn-soft:#3A2F14; --bad:#FF8A80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1220; --ink:#050A16; --surface:#131C2E; --surface-2:#1B2740; --fg:#E7ECF5; --muted:#9AA9C2; --line:#27344D;
  --sea:#0F2038; --land:#17212F; --seoul:#1F2C42; --park:#1C3030; --metro:#4FD08A;
  --accent:#FF7A3D; --accent-fg:#1A0B02; --accent-soft:#3A2012; --court:#7FA2F5; --court-soft:#1A2848; --ok:#58D08E; --ok-soft:#14362A;
  --warn:#E8B64D; --warn-soft:#3A2F14; --bad:#FF8A80; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:20px 96px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--font-display);font-weight:400;font-size:28px;line-height:1.15;margin:0}
h2{font-size:16px;margin:0}
h3{font-size:14px;margin:0;color:var(--muted)}
.sub{margin:4px 0 0;color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.muted{color:var(--muted);font-size:13px}
.demo{font-size:12px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;font-size:15px;color:var(--accent-fg);background:var(--accent);border:0;border-radius:6px;padding:12px 18px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.sec{color:var(--fg);background:var(--surface-2);font-weight:500;font-size:14px;padding:9px 14px}
.btn.ghost{color:var(--muted);background:transparent;font-weight:500;font-size:14px;padding:8px 6px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
textarea,input[type=text],select{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;line-height:1.5}
textarea{min-height:84px;resize:vertical}
textarea:focus,input:focus,select:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--court);outline-offset:1px}
label.f{font-weight:700;font-size:13px;display:flex;flex-direction:column;gap:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.notice{border-radius:6px;padding:10px 12px;font-size:13px;background:var(--warn-soft);color:var(--warn)}
.error{color:var(--bad);font-size:14px}
.status{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--court);font-size:14px}
.dots::after{content:"";animation:dots 1.2s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%,100%{content:"..."}}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none;content:"..."}}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs .in{display:flex;width:100%;max-width:560px}
.tab{flex:1;font:inherit;font-size:11px;color:var(--muted);background:transparent;border:0;padding:8px 2px 7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent);font-weight:700}

/* map */
.mapbox{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sea)}
.map{width:100%;height:auto;display:block}
.map .sea{fill:var(--sea)}
.map .land{fill:var(--land)}
.map .seoul{fill:var(--seoul);stroke:var(--muted);stroke-width:.8;stroke-dasharray:3 3;opacity:.95}
.map .park{fill:var(--park)}
.map .river{fill:none;stroke:var(--sea);stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round}
.map .metro{fill:none;stroke:var(--metro);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round;opacity:.9}
.map .stn{fill:var(--surface);stroke:var(--metro);stroke-width:1.6}
.map .area{fill:var(--muted);font-size:11px;font-weight:700;letter-spacing:.35em;opacity:.55}
.map .lbl{fill:var(--muted);font-size:8.5px}
.map .sealbl{fill:var(--court);font-size:9px;letter-spacing:.3em;opacity:.6}
.map .me{fill:var(--court);stroke:var(--surface);stroke-width:2}
.map .pulse{fill:var(--court);opacity:.18}
.map .ring{fill:none;stroke:var(--court);stroke-width:1.2;stroke-dasharray:4 3;opacity:.8}
.map .rad{fill:var(--court);opacity:.08}
.map .pin{cursor:pointer}
.map .pin path{fill:var(--accent);stroke:var(--surface);stroke-width:1.6;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.map .pin text{fill:var(--accent-fg);font-size:10.5px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.map .pin.full path{fill:var(--muted)}
.map .pin.out{opacity:.3}
.map .pin.sel path{stroke:var(--fg);stroke-width:2.4}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:-6px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--accent)}
.legend i.g{background:var(--muted)}
.legend i.l{width:16px;height:3px;border-radius:2px;transform:none;background:var(--metro)}
.legend i.m{border-radius:50%;transform:none;background:var(--court)}

/* filters */
.filters{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.filters select{padding:8px 8px;font-size:14px}

/* game card */
.game{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.game.sel{border:2px solid var(--accent)}
.game.pick{border:2px solid var(--accent)}
.game.full{opacity:.6}
.when{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.when b{font-family:var(--font-display);font-weight:400;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}
.when span{color:var(--muted);font-size:13px}
.gym{font-weight:700;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted)}
.tag{font-size:12px;border-radius:4px;padding:1px 8px;font-weight:700;display:inline-block}
.tag.fit{background:var(--accent-soft);color:var(--accent)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.full{background:var(--surface-2);color:var(--muted)}
.tag.pos{background:var(--court-soft);color:var(--court)}
.tag.vibe{background:var(--surface-2);color:var(--fg)}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--court)}
.bar.full i{background:var(--muted)}
.reason{margin:0}
.caution{margin:0;font-size:13px;color:var(--warn)}

/* detail */
.photos{display:grid;grid-template-columns:2fr 1fr;gap:6px}
.photo{background:var(--surface-2);border-radius:6px;min-height:84px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center;padding:6px}
.photos .photo:first-child{grid-row:span 2;min-height:174px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.people{display:flex;flex-wrap:wrap;gap:6px}
.person{font-size:13px;background:var(--surface-2);border-radius:999px;padding:3px 10px}
.sec-title{font-family:var(--font-display);font-size:18px;font-weight:400;margin:0}

/* host */
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:34px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font:inherit;font-size:18px;cursor:pointer}
.stepper b{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.posrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.app{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--surface-2);color:var(--muted);align-self:flex-start}
.pill.new{background:var(--accent-soft);color:var(--accent)}
.pill.wait{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.flash{background:var(--ok-soft);color:var(--ok);border-radius:6px;padding:10px 12px;font-size:14px;font-weight:500}
/* applications */
.steps{display:flex;gap:6px}
.steps div{flex:1;font-size:11px;color:var(--muted);border-top:3px solid var(--line);padding-top:4px}
.steps div.on{border-top-color:var(--accent);color:var(--fg);font-weight:700}
.steps div.done{border-top-color:var(--ok);color:var(--ok)}
.pay{background:var(--court-soft);border-radius:6px;padding:12px;font-size:14px}
.chat{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow-y:auto}
.msg{max-width:84%;border-radius:10px;padding:7px 11px;font-size:14px;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent-soft)}
.msg.cap{align-self:flex-start;background:var(--surface-2)}
.msg small{display:block;font-size:11px;color:var(--muted)}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--court);color:var(--accent-fg);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:24px}
.seg{display:flex;background:var(--surface-2);border-radius:6px;padding:3px}
.seg button{flex:1;font:inherit;font-size:14px;color:var(--muted);background:transparent;border:0;border-radius:4px;padding:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:700}
.stat{display:flex;gap:18px}
.stat div b{display:block;font-family:var(--font-display);font-weight:400;font-size:24px;line-height:1.1}
.stat div span{font-size:12px;color:var(--muted)}
.chip{font:inherit;font-size:13px;color:var(--fg);background:var(--surface-2);border:1px solid transparent;border-radius:999px;padding:6px 12px;cursor:pointer;text-align:left}
.chip:hover{border-color:var(--court)}

.kmap{width:100%;height:300px}
.kpin{position:relative;cursor:pointer;transform:translateY(-2px)}
.kpin b{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--accent);color:var(--accent-fg);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.kpin b i{transform:rotate(45deg);font-style:normal;font-size:12px;font-weight:700}
.kpin.full b{background:#6b7280}.kpin.out{opacity:.3}.kpin.sel b{outline:3px solid var(--court)}
.kme{width:16px;height:16px;border-radius:50%;background:var(--court);border:3px solid #fff;box-shadow:0 0 0 6px rgba(30,64,175,.2)}
.kname{font-size:11px;font-weight:700;background:#fff;color:#111;border-radius:6px;padding:1px 5px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.kfoot{font-size:11px;color:var(--muted);padding:4px 8px}


/* v5 sports look */
body{padding-block:0 96px}
.top{margin:0 -16px 16px;background:var(--ink);color:#fff;padding:14px 16px;border-bottom:3px solid var(--accent)}
.top .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.top svg{width:26px;height:26px;stroke:var(--accent);fill:none;stroke-width:1.8}
.top b{font-family:var(--font-display);font-weight:400;font-size:22px;letter-spacing:.02em}
.top span{margin-left:auto;font-size:12px;color:#B9C6E4}
.wrap{padding-top:2px}
.card{border-radius:12px;box-shadow:0 1px 0 rgba(11,27,58,.05)}
.btn{border-radius:10px;font-weight:800;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.sec,.btn.ghost{box-shadow:none}
a.btn{display:inline-block;text-decoration:none;text-align:center}
.tab[aria-current="page"]{box-shadow:inset 0 3px 0 var(--accent)}
.game{border-radius:12px;border-left:6px solid var(--accent);padding:14px 14px 14px 12px}
.game.full{border-left-color:var(--muted)}
.game .when b{font-size:34px}
.spots{background:var(--accent);color:var(--accent-fg);border-radius:10px;padding:6px 12px;text-align:center;line-height:1;min-width:58px}
.spots b{display:block;font-family:var(--font-display);font-weight:400;font-size:30px;line-height:1.05}
.spots span{font-size:11px;font-weight:700}
.spots.off{background:var(--surface-2);color:var(--muted)}
.tag.hot{background:var(--ink);color:#fff}
.slim{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.slim .bar{flex:1}
.hero{background:var(--ink);color:#fff;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px;border-left:6px solid var(--accent)}
.hero h1{color:#fff;font-size:26px}
.hero .when span,.hero .sub{color:#B9C6E4}
.hero .when b{font-size:40px}
.mini{height:190px;border-radius:10px;overflow:hidden;background:var(--sea);display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:13px;padding:12px}
.cta{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 14px rgba(11,27,58,.12)}
.cta .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.cta .info{flex:1;min-width:0;line-height:1.3}
.cta .info b{display:block;font-size:16px}
.cta .info span{font-size:12px;color:var(--muted)}
.cta .btn{flex:none;min-width:132px}
.fl{display:flex;gap:6px;flex-wrap:wrap}
.fl button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 12px;cursor:pointer}
.fl button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
.slots{display:flex;gap:8px;flex-wrap:wrap}
.slot{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;background:var(--bg)}
.slot.done{background:var(--ok-soft);color:var(--ok);border-color:transparent;font-weight:700}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.sum div{background:var(--bg);border-radius:8px;padding:8px 2px}
.sum b{display:block;font-family:var(--font-display);font-weight:400;font-size:24px;line-height:1.1}
.sum b.hl{color:var(--accent)}
.sum span{font-size:11px;color:var(--muted)}
.fullbn{background:var(--ink);color:#fff;border-radius:10px;padding:12px 14px;font-size:14px}
.fullbn b{color:#FFB38F}
</style></head><body>

    var F = [['all','전체',p.applicants.length],['new','새 신청',c.n],['wait','입금 대기',c.w],['ok','확정',c.o]];
    card.appendChild(h('div', {class:'fl'}, F.map(function(f){ return h('button', {type:'button', text:f[1] + ' ' + f[2], 'aria-pressed':String(state.hostFilter === f[0]), onclick:function(){ state.hostFilter = f[0]; render(); }}); })));
    var order = {new:0, accepted:1, paid:2, attended:3, noshow:4, rejected:5};
    var list = p.applicants.filter(function(a){
      var f = state.hostFilter;
      return f === 'all' || (f === 'new' && a.st === 'new') || (f === 'wait' && a.st === 'accepted') || (f === 'ok' && ['paid','attended','noshow'].indexOf(a.st) >= 0);
    }).sort(function(a, b){ return order[a.st] - order[b.st]; });
    if (!list.length) card.appendChild(h('p', {class:'muted', style:'margin:0', text:'이 상태의 신청자가 없어요.'}));
    list.forEach(function(a){ card.appendChild(applicantCard(p, a, g)); });
    card.appendChild(h('p', {class:'demo', style:'margin:0', text:'시안: 신청자는 예시예요. 수락하면 바로 정원(참가 인원)에 반영돼요.'}));
    var armed = state.delPost === p.id;
    card.appendChild(h('button', {class:'btn ghost', type:'button', style:'align-self:flex-start', text: armed ? '한 번 더 누르면 구인글이 내려가요' : '구인글 내리기', onclick:function(){
      if (!armed){ state.delPost = p.id; render(); return; }
      state.posts = state.posts.filter(function(y){ return y.id !== p.id; }); state.delPost = null; state.hostOpen = null; touch();
    }}));
  }
  function editDraft(p){
    var d0 = Math.round((new Date(p.date + 'T00:00:00') - base) / 86400000);
    state.draft = {gym:p.gymName, dayOff:Math.max(0, Math.min(13, d0)), t:p.t, cap:p.joinedN + Object.keys(p.needPos).reduce(function(a, k){ return a + p.needPos[k]; }, 0), joinedN:p.joinedN, need:{'가드':p.needPos['가드'] || 0, '포워드':p.needPos['포워드'] || 0, '센터':p.needPos['센터'] || 0}, lvl:p.lvl, vibe:p.vibe, game:p.game, total:p.total, fee:String(p.fee), fac:Object.assign({}, p.fac), note:p.note || ''};
    state.editId = p.id; state.dupId = null; state.compose = true; state.composeErr = '';
    render(); window.scrollTo(0, 0);
  }
  function ago(ts){ var m = Math.round((Date.now() - ts) / 60000); return m < 1 ? '방금' : m < 60 ? m + '분 전' : Math.floor(m / 60) + '시간 전'; }
  function copyDraft(p){
    var d0 = Math.round((new Date(p.date + 'T00:00:00') - base) / 86400000), off = d0 + 7;
    while (off < 1) off += 7;
    if (off > 13) off = 13;
    state.draft = {gym:p.gymName, dayOff:off, t:p.t, cap:p.joinedN + Object.keys(p.needPos).reduce(function(a, k){ return a + p.needPos[k]; }, 0), joinedN:p.joinedN, need:{'가드':p.needPos['가드'] || 0, '포워드':p.needPos['포워드'] || 0, '센터':p.needPos['센터'] || 0}, lvl:p.lvl, vibe:p.vibe, game:p.game, total:p.total, fee:String(p.fee), fac:Object.assign({}, p.fac), note:p.note || ''};
    state.editId = null; state.dupId = null; state.compose = true; state.composeErr = ''; state.flash = '지난 글을 복사했어요. 날짜와 인원만 확인하고 올리세요.';
    render(); window.scrollTo(0, 0);
  }

  /* ---------- 렌더 ---------- */
  var ICON = {
    near:'<path d="M12 21s-6-5.2-6-10a6 6 0 0 1 12 0c0 4.8-6 10-6 10z"/><circle cx="12" cy="11" r="2.2"/>',
    ask:'<path d="M4 5h16v10H9l-5 4z"/><path d="M8 9h8M8 12h5"/>',
    mine:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
    host:'<path d="M4 10v4h3l7 4V6L7 10z"/><path d="M17.5 9a4 4 0 0 1 0 6"/>',
    me:'<circle cx="12" cy="8" r="3.5"/><path d="M5 20c1-4 4-6 7-6s6 2 7 6"/>'
  };
  var TABS = [['near','내 주변'],['ask','말로 추천'],['mine','내 신청'],['host','모집하기'],['me','내 정보·팀']];
  function renderTabs(){
    var box = $('#tabs'); box.textContent = '';
    TABS.forEach(function(t){
      var b = h('button', {class:'tab', type:'button', onclick:function(){ state.tab = t[0]; state.detail = null; render(); window.scrollTo(0, 0); }});
      if (state.tab === t[0]) b.setAttribute('aria-current', 'page');
      var s = svg('svg', {viewBox:'0 0 24 24', 'aria-hidden':'true'}); s.innerHTML = ICON[t[0]];
      b.appendChild(s); b.appendChild(document.createTextNode(t[1]));
      box.appendChild(b);
    });
  }
  function render(){
    var root = $('#view'); var y = window.scrollY; root.textContent = '';
    renderTabs(); $('.tabs').hidden = !!state.detail;
    if (state.detail) viewDetail(root);
    else if (state.tab === 'near') viewNear(root);
    else if (state.tab === 'ask') viewAsk(root);
    else if (state.tab === 'mine') viewMine(root);
    else if (state.tab === 'host') viewHost(root);
    else viewMe(root);
    if (!state.sel) window.scrollTo(0, y);
  }

  loadKakao();
  render();
  if (window.claude && typeof window.claude.use === 'function'){
    window.claude.use('sample').then(function(s){ sample = s; sampleState = s ? 'ok' : 'none'; if (state.tab === 'ask' && !state.detail) render(); }, function(){ sampleState = 'none'; if (state.tab === 'ask') render(); });
  } else { sampleState = 'none'; }
})();
</script>
</body></html>
